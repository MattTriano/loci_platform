[workspace]
resolver = "2"
members = [
    "routing-core",
    "routing-lambda",
    "routing-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

# Workspace-wide lints. Individual crates inherit with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
