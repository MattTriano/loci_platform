loci:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST', 'postgis') }}"
      user: loci
      password: loci
      port: "{{ env_var('DBT_PG_PORT', '5432') | int }}"
      dbname: loci
      schema: staging
      threads: 12

    staging:
      type: postgres
      host: postgis
      user: loci
      password: loci
      port: 5432
      dbname: loci
      schema: staging
      threads: 12

    prod:
      type: postgres
      host: postgis
      user: loci
      password: loci
      port: 5432
      dbname: loci
      schema: staging
      threads: 12