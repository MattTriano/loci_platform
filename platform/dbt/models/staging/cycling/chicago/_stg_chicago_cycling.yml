version: 2

models:
  - name: stg_chicago_bike_ways
    columns:
      - name: osm_id
        data_tests:
          - not_null
          - unique  # one current row per way after the valid_to filter
      - name: geom
        data_tests:
          - not_null
      - name: node_ids
        data_tests:
          - not_null
      - name: node_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2  # a way with <2 nodes isn't a real way
      - name: highway
        data_tests:
          - dbt_utils.not_empty_string

  - name: stg_chicago_traffic_control_nodes
    description: >
      Logical bike-network intersections with stress penalties.
      A row exists for each node where >= 2 distinct OSM ways meet
      AND >= 1 of those ways carries cars. Joined into
      chicago_bike_stress_weighted_segments on end_node_id.
    columns:
      - name: osmid
        description: OSM node id (unique).
        tests:
          - not_null
          - unique
          - dbt_utils.relationships_where:
              arguments:
                to: source('osm', 'chicago_osm_bike_network_nodes')
                field: osm_id
                from_condition: "traffic_control is not null"
                to_condition: "osm_type = 'node' and valid_to is null"
              config:
                severity: warn
      - name: traffic_control
        description: >
          Raw OSM 'highway' tag value on the node, or NULL for
          uncontrolled intersections.
        tests:
          - accepted_values:
              arguments:
                values:
                  - traffic_signals
                  - stop
                  - crossing
                  - mini_roundabout
                  - give_way
                  - turning_circle
                  - turning_loop
                quote: true
      - name: max_road_class
        description: Worst road class among car-carrying ways at this node.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['primary', 'secondary', 'tertiary', 'minor']

      - name: max_road_rank
        description: Numeric form of max_road_class (1-4).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
      - name: traffic_control_penalty
        description: Stress cost added to a route for traversing this node.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200

  - name: stg_chicago_way_nodes
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [way_id, position]
    columns:
      - name: way_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_chicago_bike_ways')
                field: osm_id
      - name: position
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1  # ordinality is 1-indexed
      - name: node_id
        tests:
          - not_null

  - name: stg_chicago_intersection_nodes
    tests:
      - intersection_node_count_in_range:
          arguments:
            way_nodes_model: ref('stg_chicago_way_nodes')
    columns:
      - name: node_id
        tests:
          - not_null
          - unique


  - name: stg_chicago_way_segments
    tests:
      - segment_endpoints_match_node_ids:
          arguments:
            ways_model: ref('stg_chicago_bike_ways')
      - segments_cover_full_ways:
          arguments:
            way_nodes_model: ref('stg_chicago_way_nodes')
            intersection_nodes_model: ref('stg_chicago_intersection_nodes')
      - segment_geom_endpoints_match_node_positions:
          arguments:
            ways_model: ref('stg_chicago_bike_ways')
