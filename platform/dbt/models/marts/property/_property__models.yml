models:
  - name: dim_chicago_contractors
    columns:
      - name: contractor_id
        tests: [unique, not_null]
  - name: chicago_contractor_services
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [contractor_id, service, evidence]
    columns:
      - name: contractor_id
        tests: [not_null]
      - name: service
        tests: [not_null]
