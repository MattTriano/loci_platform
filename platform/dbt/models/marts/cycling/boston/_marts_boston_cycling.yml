version: 2
models:
  - name: boston_segment_costs
    description: "Per-segment intrinsic stress costs from OSM physical attributes.\
      \ physical_cost = length_m * (base_stress_per_meter + surface_penalty + enclosed_penalty\
      \ + lighting_penalty), where base_stress_per_meter is at least 1.0 \u2014 so\
      \ physical_cost is always at least length_m."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - segment_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: physical_cost >= length_m
          config:
            name: boston_segment_costs_physical_cost_at_least_length
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_boston_bike_segments')
    columns:
      - name: segment_id
        data_tests:
          - not_null
          - unique
      - name: way_id
        data_tests:
          - not_null
      - name: start_node_id
        data_tests:
          - not_null
      - name: end_node_id
        data_tests:
          - not_null
      - name: length_m
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: geom
        data_tests:
          - not_null
      - name: highway_class
        description: Bucketed OSM highway value. Drives base_stress_per_meter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - quiet
                  - service
                  - local
                  - tertiary
                  - secondary
                  - primary
                  - motorway
      - name: infra_tier
        description: Bucketed bike-infra quality. Drives base_stress_per_meter.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - protected
                  - lane
                  - shared_path
                  - sharrow
                  - none
      - name: base_stress_per_meter
        description: Per-meter stress cost from the (highway_class, infra_tier) lookup.
          Minimum 1.0 (cycleway / quiet path).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1.0
      - name: surface_penalty
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
      - name: enclosed_penalty
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
      - name: lighting_penalty
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0
      - name: physical_cost
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: infra_category
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - separated
                  - on_road
                  - shared
                  - path
              config:
                where: infra_category is not null
  - name: boston_intersection_costs
    description: Logical bike-network intersections with stress penalties. One row
      per node where >= 2 distinct OSM ways meet. The cost depends on the top two
      way classes meeting at the node and the traffic-control tag. Joined into boston_bike_stress_weighted_segments
      on BOTH endpoints (start_node_id and end_node_id) so the graph exporter can
      pick the right one per traversal direction.
    columns:
      - name: osmid
        description: OSM node id (unique).
        data_tests:
          - not_null
          - unique
          - dbt_utils.relationships_where:
              arguments:
                to: source('osm', 'boston_osm_bike_network_nodes')
                field: osm_id
                from_condition: traffic_control is not null
                to_condition: osm_type = 'node' and valid_to is null
              config:
                severity: warn
      - name: traffic_control
        description: Raw OSM 'highway' tag value on the node, or NULL for uncontrolled
          intersections.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - traffic_signals
                  - stop
                  - crossing
                  - mini_roundabout
                  - give_way
                  - turning_circle
                  - turning_loop
                quote: true
              config:
                severity: warn
      - name: max_class
        description: Highest stress class among the ways meeting at this node. Drives
          the base intersection cost lookup.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - motorway
                  - primary
                  - secondary
                  - tertiary
                  - local
                  - service
                  - quiet
      - name: second_max_class
        description: Second-highest stress class. Used as a tie-break override for
          local-and-below intersections (e.g. local x service is cheaper than local
          x local).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - motorway
                  - primary
                  - secondary
                  - tertiary
                  - local
                  - service
                  - quiet
      - name: way_count
        description: Number of distinct ways meeting at this node.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2
      - name: base_cost
        description: Base intersection cost from the (max_class, second_max_class)
          lookup, before applying the traffic-control multiplier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: intersection_cost
        description: Final intersection cost = base_cost * traffic_control_multiplier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  - name: boston_bike_stress_weighted_segments
    description: Stress-weighted segments for bike routing. One row per undirected
      segment; direction is carried as a column. Exposes physical_cost, crash_cost,
      and intersection costs at BOTH endpoints. The graph exporter composes per-direction
      stress when expanding each row into one or two directed edges (forward edges
      pay intersection_cost_at_end; backward edges pay intersection_cost_at_start).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - start_node_id
              - end_node_id
              - way_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: physical_cost >= length_m
          config:
            name: boston_stress_weighted_physical_cost_at_least_length
      - dbt_utils.expression_is_true:
          arguments:
            expression: crash_cost >= 0
          config:
            name: boston_crash_cost_non_negative
      - dbt_utils.expression_is_true:
          arguments:
            expression: elevation_cost_forward >= 0
          config:
            name: boston_stress_weighted_elevation_cost_forward_non_negative
      - dbt_utils.expression_is_true:
          arguments:
            expression: elevation_cost_backward >= 0
          config:
            name: boston_stress_weighted_elevation_cost_backward_non_negative
      - dbt_utils.expression_is_true:
          arguments:
            expression: intersection_cost_at_start >= 0
          config:
            name: boston_intersection_cost_at_start_non_negative
      - dbt_utils.expression_is_true:
          arguments:
            expression: intersection_cost_at_end >= 0
          config:
            name: boston_intersection_cost_at_end_non_negative
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_boston_bike_segments')
    columns:
      - name: segment_id
        data_tests:
          - not_null
          - unique
      - name: start_node_id
        data_tests:
          - not_null
      - name: end_node_id
        data_tests:
          - not_null
      - name: way_id
        data_tests:
          - not_null
      - name: length_m
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: geom
        data_tests:
          - not_null
      - name: physical_cost
        data_tests:
          - not_null
      - name: crash_cost
        data_tests:
          - not_null
      - name: elevation_cost_forward
        data_tests:
          - not_null
      - name: elevation_cost_backward
        data_tests:
          - not_null
      - name: intersection_cost_at_start
        description: Intersection cost at the start of the segment. Paid by backward-direction
          edges (which approach the start).
        data_tests:
          - not_null
      - name: intersection_cost_at_end
        description: Intersection cost at the end of the segment. Paid by forward-direction
          edges (which approach the end).
        data_tests:
          - not_null
      - name: start_is_intersection
        description: True iff start_node_id appears in boston_intersection_costs.
          Propagated through the graph format so the routing service doesn't have
          to re-derive it from edge degree.
        data_tests:
          - not_null
      - name: end_is_intersection
        data_tests:
          - not_null
      - name: base_stress_per_meter
        data_tests:
          - not_null
      - name: surface_penalty
        data_tests:
          - not_null
      - name: enclosed_penalty
        data_tests:
          - not_null
      - name: lighting_penalty
        data_tests:
          - not_null
  - name: boston_segment_elevation_costs
    description: Directional elevation cost per segment from the endpoint elevation
      delta, quadratic in grade with separate up/down coefficients. One row per segment_id.
      Costs coalesce to 0 on a coverage gap (treated as flat).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_boston_bike_segments')
      - dbt_utils.expression_is_true:
          arguments:
            expression: elevation_cost_forward >= 0
          config:
            name: boston_elevation_cost_forward_non_negative
      - dbt_utils.expression_is_true:
          arguments:
            expression: elevation_cost_backward >= 0
          config:
            name: boston_elevation_cost_backward_non_negative
    columns:
      - name: segment_id
        data_tests:
          - not_null
          - unique
      - name: start_node_id
        description: "Completeness check \u2014 every endpoint must resolve in node_elevations."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_boston_node_elevations')
                field: node_id
      - name: end_node_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_boston_node_elevations')
                field: node_id
      - name: elevation_cost_forward
        data_tests:
          - not_null
      - name: elevation_cost_backward
        data_tests:
          - not_null
