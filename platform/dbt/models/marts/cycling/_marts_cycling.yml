version: 2

models:
  # ==================================================================
  # bike_safety_weighted_edges
  # ==================================================================
  - name: bike_safety_weighted_edges
    description: >
      Safety-weighted directed edges for bike routing. One row per
      directed edge (u, v, key). safety_cost is the primary routing
      weight, combining length, speed, infrastructure, surface,
      lighting, crash history, and traffic control penalties.

    # ── Model-level tests ──
    data_tests:
      # Primary key: each directed edge is unique
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - u
              - v
              - key

      # safety_cost must never be negative (A* correctness)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "safety_cost >= 0"
          config:
            name: safety_cost_non_negative


      # crash_penalty must be non-negative (it's an additive cost)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "crash_penalty >= 0"
          config:
            name: crash_penalty_non_negative

      # Every edge from the source network must be present.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('chicago_bike_network_edges')

      # safety_cost should always be >= length_m * min possible factor product
      # (0.5 * 1.0 * 1.0 * 1.0 = 0.5), so safety_cost >= length_m * 0.5.
      # We test a weaker version: safety_cost > 0 for non-zero-length edges.
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: safety_cost
            column_B: length_m
            or_equal: false
            row_condition: >
              length_m > 1
              and infrastructure_factor > 1.0
              and speed_factor > 1.0
            config:
              # This is a sanity check, not a hard constraint — crash penalty
              # and traffic control penalty are additive so safety_cost can
              # exceed length_m even at factor=1.0. We test the subset where
              # factors are elevated.
              severity: warn
      - compare_aggregations:
          arguments:
            other_model: "ref('bike_crash_hotspots')"
            this_model_agg: "sum(crash_count)"
            other_model_agg: "count(distinct crash_record_id)"
            assertion: "this_model_agg / other_model_agg::float between 0.99 and 1.0"

    columns:
      - name: u
        data_tests:
          - not_null
      - name: v
        data_tests:
          - not_null
      - name: key
        data_tests:
          - not_null
      - name: length_m
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: safety_cost
        data_tests:
          - not_null
      - name: speed_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1.0
                max_value: 2.0
      - name: infrastructure_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.0
                max_value: 1.0
      - name: surface_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1.0
                max_value: 1.5
      - name: lighting_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1.0
                max_value: 1.2
      - name: crash_penalty
        data_tests:
          - not_null
      - name: traffic_control_penalty
        data_tests:
          - not_null
      - name: geom
        data_tests:
          - not_null

  # ==================================================================
  # bike_crash_hotspots
  # ==================================================================
  - name: bike_crash_hotspots
    description: >
      Bike crash data with severity scores, deduplicated to one row per crash.
    columns:
      - name: crash_record_id
        tests:
          - unique
          - not_null
      - name: severity_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: geom
        tests:
          - not_null
      - name: crash_date
        tests:
          - not_null
