version: 2

models:
  # ==================================================================
  # chicago_bike_crash_hotspots
  # ==================================================================
  - name: chicago_bike_crash_hotspots
    description: >
      Bike crash data with severity scores, deduplicated to one row per crash.
    columns:
      - name: crash_record_id
        tests:
          - unique
          - not_null
      - name: severity_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: geom
        tests:
          - not_null
      - name: crash_date
        tests:
          - not_null
