version: 2

models:
  # ==================================================================
  # chicago_bike_stress_weighted_edges
  # ==================================================================
  - name: chicago_bike_stress_weighted_edges
    description: >
      Stress-weighted directed edges for bike routing. One row per
      directed edge (u, v, key). stress_cost is the primary routing
      weight, combining length, speed, infrastructure, surface,
      lighting, crash history, and traffic control penalties.

    # ── Model-level tests ──
    data_tests:
      # Primary key: each directed edge is unique
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - u
              - v
              - key

      # stress_cost must never be negative (A* correctness)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "stress_cost >= 0"
          config:
            name: stress_cost_non_negative


      # edge_crash_penalty must be non-negative (it's an additive cost)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "edge_crash_penalty >= 0"
          config:
            name: edge_crash_penalty_non_negative
      # node_crash_penalty must be non-negative (it's an additive cost)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "node_crash_penalty >= 0"
          config:
            name: node_crash_penalty_non_negative

      # Every edge from the source network must be present.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('chicago_bike_network_edges')

      # - compare_aggregations:
      #     arguments:
      #       other_model: "ref('chicago_bike_crash_hotspots')"
      #       this_model_agg: "sum(edge_crash_count) + sum(node_crash_count)"
      #       other_model_agg: "count(distinct crash_record_id)"
      #       assertion: "this_model_agg / other_model_agg::float between 0.995 and 1.0"

    columns:
      - name: u
        data_tests:
          - not_null
      - name: v
        data_tests:
          - not_null
      - name: key
        data_tests:
          - not_null
      - name: length_m
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true
      - name: stress_cost
        data_tests:
          - not_null
      - name: speed_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1.0
                max_value: 2.0
      - name: road_infra_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.2
                max_value: 3.5
      - name: surface_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1.0
                max_value: 1.5
      - name: lighting_factor
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1.0
                max_value: 1.2
      - name: edge_crash_penalty
        data_tests:
          - not_null
      - name: node_crash_penalty
        data_tests:
          - not_null
      - name: traffic_control_penalty
        data_tests:
          - not_null
      - name: geom
        data_tests:
          - not_null

  # ==================================================================
  # chicago_bike_crash_hotspots
  # ==================================================================
  - name: chicago_bike_crash_hotspots
    description: >
      Bike crash data with severity scores, deduplicated to one row per crash.
    columns:
      - name: crash_record_id
        tests:
          - unique
          - not_null
      - name: severity_score
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: geom
        tests:
          - not_null
      - name: crash_date
        tests:
          - not_null
